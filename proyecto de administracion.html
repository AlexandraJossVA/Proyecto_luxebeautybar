const solicitudes=()=>sorted(S.ap.filter(a=>a.solCancel&&act(a)&&a.est!=='atendida'));
const BADGE=k=>k==='especialistas'?(solicitudes().length||''):'';
/* tabla de solicitudes de cancelación que mandan las especialistas */
const tablaSol=l=>l.length?`<div class="tw"><table><tr><th>Cita</th><th>Clienta</th><th>Especialista</th><th>Motivo</th><th>Pago</th><th></th></tr>${l.map(a=>`<tr><td>${fd(a.f)}<br><b>${a.h}</b><br><span class="mut">${svc(a.sid).n} · ${money(svc(a.sid).p)}</span></td><td>${cli(a.cli).n}<br><span class="mut">${cli(a.cli).t||''}</span></td><td>${esp(a.eid).n}</td><td>${a.solCancel.m?a.solCancel.m.replace(/</g,'&lt;'):'<span class="mut">Sin motivo</span>'}</td><td>${pagoTag(a)}</td><td><button class="btn s bad" onclick="cancelar(${a.id},1)">Aprobar cancelación</button><button class="btn s o" onclick="rechazarCancel(${a.id})">Rechazar</button></td></tr>`).join('')}</table></div>`:'';

$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
let F={f1:'',f2:'',f3:'',f4:''},OD=today;

V.resumen=()=>{
 const hoy=S.ap.filter(a=>a.f===today),deben=S.ap.filter(debe).filter(a=>a.f<=today||a.est==='atendida'),
  reem=S.ap.filter(a=>a.pago==='reembolso pendiente'),ult=[...S.ap].filter(a=>a.creada).sort((a,b)=>b.creada-a.creada).slice(0,5);
 return head('Resumen del día','Todo lo que agendan las clientas aparece aquí automáticamente.')+
 `<div class="grid"><div class="card stat"><b>${hoy.filter(act).length}</b><span>citas hoy</span></div>
 <div class="card stat"><b>${hoy.filter(a=>a.est==='atendida').length}</b><span>ya pasaron hoy</span></div>
 <div class="card stat warn"><b>${money(deben.reduce((t,a)=>t+svc(a.sid).p,0))}</b><span>por cobrar (${deben.length} citas)</span></div>
 <div class="card stat"><b>${money(ing(hoy))}</b><span>cobrado hoy</span></div>
 <div class="card stat ${reem.length?'warn':''}"><b>${reem.length}</b><span>reembolsos por registrar</span></div>
 <div class="card stat"><b>${S.ap.filter(a=>a.est==='pendiente').length}</b><span>citas por confirmar</span></div>
 <div class="card stat ${solicitudes().length?'warn':''}"><b>${solicitudes().length}</b><span>cancelaciones por aprobar</span></div></div>
 ${solicitudes().length?`<h3>Cancelaciones solicitadas por especialistas</h3>${tablaSol(solicitudes())}<div style="height:12px"></div>`:''}
 ${ult.length?`<h3>Últimas citas agendadas por clientas</h3>${tabla(ult,1,1)}`:''}

};
V.citas=()=>head('Citas agendadas','Todas las citas que han hecho tus clientas.')+
 `<div class="flt"><div><label for="f1">Fecha</label><select id="f1"><option value="">Todas</option><option value="hoy">Hoy</option><option value="prox">Próximas</option><option value="ant">Anteriores</option></select></div>
 <div><label for="f2">Estado</label><select id="f2"><option value="">Todos</option><option value="atendida">Ya pasó</option><option value="confirmada">Confirmada</option><option value="pendiente">Por confirmar</option><option value="cancelada">Cancelada</option></select></div>

 <div><label for="f4">Clienta</label><select id="f4"><option value="">Todas</option>${S.cli.map(c=>`<option value="${c.id}">${c.n}</option>`).join('')}</select></div></div><div id="tb"></div>`;
B.citas=()=>{const d=()=>{
 ['f1','f2','f3','f4'].forEach(i=>F[i]=$('#'+i).value);const{f1,f2,f3,f4}=F;
 $('#tb').innerHTML=tabla(sorted(S.ap.filter(a=>(!f1||(f1==='hoy'?a.f===today:f1==='prox'?a.f>today:a.f<today))&&(!f2||a.est===f2)&&(!f3||a.pago===f3)&&(!f4||a.cli==f4))),1,1)};
 ['f1','f2','f3','f4'].forEach(i=>{$('#'+i).value=F[i];$('#'+i).onchange=d});d()};
/* ---------- AGENDA DE ESPECIALISTAS ---------- */
let EP=0,ED=today,EG='prox';
V.especialistas=()=>{
 const sol=solicitudes();
 return head('Agenda de especialistas','Citas, horarios libres y solicitudes de cancelación de cada especialista.')+
 (sol.length?`<h3>Solicitudes de cancelación (${sol.length})</h3><p class="mut" style="margin:-4px 0 10px">La clienta sigue viendo su cita normal hasta que apruebes la cancelación.</p>${tablaSol(sol)}<div style="height:14px"></div>`:'<div class="card empty" style="margin-bottom:18px">No hay solicitudes de cancelación pendientes.</div>')+

 :'<div class="card empty">Aún no hay especialistas registradas. Ve a "Personal" y otorga permiso de registro con su correo.</div>');
};

 if(!esp(EP))EP=S.esp[0].id;
 const d=()=>{
  EP=+$('#ep').value;ED=$('#ed').value||today;EG=$('#eg').value;
  const e=esp(EP),q=S.ap.filter(a=>a.eid===e.id),dia=sorted(q.filter(a=>a.f===ED&&act(a))),libres=[];
  if(e.act)for(let m=e.hi;m+30<=e.hf;m+=30)if(libre(e.id,ED,fh(m),30)&&!(ED===today&&m<=nowMin()))libres.push(fh(m));
  const lista=sorted(q.filter(a=>EG==='todas'||(EG==='hoy'?a.f===today:EG==='prox'?a.f>=today&&act(a):a.f<today)));
  $('#eb').innerHTML=`<div class="card"><b>${e.n}</b> <span class="mut">· ${e.e||'Sin especialidad'}</span> ${tag(e.act?'Activa':'Inactiva',e.act?'ok':'no')}<br>
  <span class="mut">Servicios: ${e.s.map(i=>svc(i)?.n).join(', ')||'—'} · Horario: ${fh(e.hi)} a ${fh(e.hf)} · ${e.t||'Sin teléfono'} · ${e.c}</span></div>
  <h3 style="margin-top:20px">Horarios del ${fd(ED)}</h3>
  <div class="row"><div class="card"><h3>Libres</h3>${!e.act?'<span class="mut">Especialista inactiva: no recibe citas.</span>':libres.length?`<div class="slots">${libres.map(h=>tag(h,'ok')).join('')}</div>`:'<span class="mut">Sin horarios libres este día.</span>'}</div>
  <div class="card"><h3>Ocupados</h3>${dia.length?dia.map(a=>`<div class="bl"><span><b>${a.h} a ${fh(tm(a.h)+svc(a.sid).d)}</b> · ${cli(a.cli).n}</span><span class="mut">${svc(a.sid).n}${a.solCancel?' · '+tag('Pidió cancelar','no'):''}</span></div>`).join(''):'<span class="mut">Sin citas este día.</span>'}</div></div>
  <h3 style="margin-top:20px">Citas de ${e.n}</h3>${tabla(lista,1)}`};
 $('#ep').value=EP;$('#eg').value=EG;
 ['ep','ed','eg'].forEach(i=>$('#'+i).onchange=d);d()};
V.pagos=()=>{
 const l=sorted(S.ap.filter(debe)),r=sorted(S.ap.filter(a=>a.pago==='reembolso pendiente')),pg=sorted(S.ap.filter(a=>a.pago==='pagado')).reverse().slice(0,10);
 return head('Pagos y reembolsos','Cobros pendientes, pagos en línea recibidos y reembolsos por cancelación.')+
 `<div class="grid"><div class="card stat warn"><b>${money(l.reduce((t,a)=>t+svc(a.sid).p,0))}</b><span>falta por cobrar (${l.length})</span></div>
 <div class="card stat warn"><b>${money(r.reduce((t,a)=>t+svc(a.sid).p,0))}</b><span>por reembolsar (${r.length})</span></div></div>
 <h3>Por cobrar</h3>${tabla(l,1,1)}
 <h3 style="margin-top:24px">Reembolsos por registrar</h3>${r.length?tabla(r,1,1):'<div class="card empty">Sin reembolsos pendientes.</div>'}
 <h3 style="margin-top:24px">Últimos pagos recibidos</h3>${tabla(pg,1,1)}`;
};
V.ocupacion=()=>head('Horarios ocupados','Qué especialista tiene ocupado cada horario, y con quién.')+
 `<div class="flt"><div><label for="od">Día</label><input type="date" id="od" value="${OD}"></div></div><div id="og"></div>`;
B.ocupacion=()=>{const d=()=>{
 const f=OD=$('#od').value,E=S.esp.filter(e=>e.act),ap=S.ap.filter(a=>a.f===f&&act(a));let rows='';
 for(let m=OPEN;m<CLOSE;m+=30){
  rows+=`<tr><th>${fh(m)}</th>`+E.map(e=>{
   if(m<e.hi||m>=e.hf)return `<td class="cont">Fuera de horario</td>`;
   const a=ap.find(x=>x.eid===e.id&&tm(x.h)<=m&&m<tm(x.h)+svc(x.sid).d);
   return !a?`<td class="free">Libre</td>`:tm(a.h)===m?`<td class="busy">${cli(a.cli).n}<br><span class="mut">${svc(a.sid).n} · ${a.h} a ${fh(tm(a.h)+svc(a.sid).d)}</span></td>`:`<td class="cont">↳ ocupada</td>`}).join('')+'</tr>';}
 if(!E.length)return $('#og').innerHTML='<div class="card empty">Aún no hay especialistas activas.</div>';
 $('#og').innerHTML=`<div class="tw"><table class="occ"><tr><th>Hora</th>${E.map(e=>`<th>${e.n}<br><span class="mut">${e.s.map(i=>svc(i)?.n).join(', ')}</span></th>`).join('')}</tr>${rows}</table></div>`};
 $('#od').onchange=d;d()};
V.clientas=()=>head('Clientas','Información, historial y servicios que más piden.')+
 `<div class="tw"><table><tr><th>Nombre</th><th>Contacto</th><th>Citas · pagado</th><th>Debe</th><th>Servicio frecuente</th><th>Cuenta</th><th></th></tr>${S.cli.map(c=>{
 const l=S.ap.filter(a=>a.cli===c.id&&act(a)),cnt={};l.forEach(a=>cnt[a.sid]=(cnt[a.sid]||0)+1);
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0],dd=l.filter(debe).reduce((t,a)=>t+svc(a.sid).p,0);
 return `<tr><td><b>${c.n}</b></td><td>${c.c}<br><span class="mut">${c.t}</span></td><td>${l.length} · ${money(ing(l))}</td><td>${dd?tag(money(dd),'no'):'—'}</td><td>${top?svc(top[0]).n+' ('+top[1]+')':'—'}</td><td>${tag(c.act?'Activa':'Inactiva',c.act?'ok':'no')}</td>
 <td><button class="btn s o" onclick="togC(${c.id})">${c.act?'Desactivar':'Activar'}</button></td></tr>`}).join('')}</table></div>${S.cli.length?'':'<div class="card empty">Aún no hay clientas registradas. Aparecerán aquí cuando creen su cuenta.</div>'}`;
const togC=id=>{S=load();const c=cli(id);c.act=c.act?0:1;save();go(view)};
V.servicios=()=>head('Servicios','Agrega, edita o quita servicios del catálogo.')+
 `<div class="tw"><table><tr><th>Servicio</th><th>Precio</th><th>Duración</th><th></th></tr>${S.svc.map(s=>`<tr><td><b>${s.n}</b></td><td>${money(s.p)}</td><td>${s.d} min</td><td><button class="btn s o" onclick="edS(${s.id})">Editar</button><button class="btn s bad" onclick="delS(${s.id})">Quitar</button></td></tr>`).join('')}</table></div>
 <button class="btn" style="margin-top:16px" onclick="edS()">Agregar servicio</button>`;
const edS=id=>{
 S=load();const s=id?svc(id):{};const n=prompt('Nombre del servicio:',s.n||'');if(!n)return;
 const p=+prompt('Precio (MXN):',s.p||''),d=+prompt('Duración en minutos:',s.d||'');
 if(!(p>0)||!(d>0))return toast('Precio y duración deben ser números mayores a 0');
 if(id)Object.assign(s,{n,p,d});else S.svc.push({id:Date.now(),n,p,d});save();go(view)};
const delS=id=>{S=load();if(S.ap.some(a=>a.sid===id&&nextOnes([a]).length))return toast('Tiene citas próximas; reprográmalas o cancélalas primero');
 if(confirm('¿Quitar este servicio?')){S.svc=S.svc.filter(s=>s.id!==id);S.esp.forEach(e=>e.s=e.s.filter(x=>x!==id));save();go(view)}};
V.personal=()=>head('Personal','Especialistas y permisos de registro.')+
 `<div class="tw"><table><tr><th>Especialista</th><th>Correo</th><th>Servicios</th><th>Horario</th><th>Estado</th><th></th></tr>${S.esp.map(e=>`<tr><td><b>${e.n}</b><br><span class="mut">${e.e||''}</span></td><td>${e.c}</td><td>${e.s.map(i=>svc(i)?.n).join(', ')||'—'}</td><td>${fh(e.hi)} a ${fh(e.hf)}</td><td>${tag(e.act?'Activa':'Inactiva',e.act?'ok':'no')}</td><td><button class="btn s o" onclick="togE(${e.id})">${e.act?'Desactivar':'Activar'}</button></td></tr>`).join('')}</table></div>
 ${S.esp.length?'':'<div class="card empty" style="margin-top:8px">Aún no hay personal registrado. Otorga un permiso con el correo de la especialista y ella crea su cuenta.</div>'}
 <div class="card" style="margin-top:16px"><h3>Permiso de registro</h3><p class="mut">La persona podrá crear su cuenta de especialista en la página de especialistas con este correo.</p>
 <div class="row" style="margin-top:10px"><input id="np" type="email" placeholder="Correo del nuevo personal" aria-label="Correo del nuevo personal"><button class="btn" style="flex:0;white-space:nowrap" onclick="permiso()">Otorgar permiso</button></div>
 ${(S.perm||[]).length?`<p class="mut" style="margin-top:10px">Permisos vigentes: ${S.perm.join(', ')}</p>`:''}</div>`;
const togE=id=>{S=load();const e=esp(id);e.act=e.act?0:1;save();go(view)};
const permiso=()=>{const c=$('#np').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(c))return toast('Escribe un correo válido');
 S=load();S.perm=S.perm||[];if(S.esp.some(e=>e.c===c)||S.perm.includes(c))return toast('Ese correo ya tiene cuenta o permiso');
 S.perm.push(c);save();toast('Permiso otorgado a '+c);go(view)};
V.reportes=()=>head('Reportes','Ingresos, servicios más solicitados y desempeño del personal.')+
 `<div class="flt"><div><label for="per">Periodo</label><select id="per"><option value="0">Hoy</option><option value="7">Últimos 7 días</option><option value="30" selected>Últimos 30 días</option><option value="999">Todo</option></select></div></div><div id="rep"></div>`;
B.reportes=()=>{const draw=()=>{
 const n=+$('#per').value,desde=n===999?'0':add(-n),l=S.ap.filter(a=>a.f>=desde&&a.f<=today);
 const cnt=S.svc.map(s=>({n:s.n,c:l.filter(a=>a.sid===s.id&&act(a)).length})).sort((a,b)=>b.c-a.c),mx=Math.max(1,...cnt.map(x=>x.c));
 const hoy=S.ap.filter(a=>a.f===today);
 $('#rep').innerHTML=`<div class="grid"><div class="card stat"><b>${money(ing(l))}</b><span>ingresos del periodo</span></div><div class="card stat"><b>${l.filter(a=>a.est==='atendida').length}</b><span>citas atendidas</span></div></div>
 <div class="row"><div class="card"><h3>Servicios más solicitados</h3>${cnt.map(x=>`<div class="bl"><span>${x.n}</span><b>${x.c}</b></div><div class="bar" style="width:${x.c/mx*100}%"></div>`).join('')}</div>
 <div class="card"><h3>Desempeño por especialista</h3><table style="min-width:0">${S.esp.map(e=>{const q=l.filter(a=>a.eid===e.id);return `<tr><td>${e.n}</td><td>${q.filter(a=>a.est==='atendida').length} atendidas</td><td><b>${money(ing(q))}</b></td></tr>`}).join('')}</table></div>
 <div class="card"><h3>Citas de hoy</h3><table style="min-width:0"><tr><td>Programadas</td><td><b>${hoy.filter(a=>a.est==='pendiente'||a.est==='confirmada').length}</b></td></tr><tr><td>Atendidas</td><td><b>${hoy.filter(a=>a.est==='atendida').length}</b></td></tr><tr><td>Canceladas</td><td><b>${hoy.filter(a=>a.est==='cancelada').length}</b></td></tr></table></div></div>`};
 $('#per').onchange=draw;draw()};
</script>
</body>
